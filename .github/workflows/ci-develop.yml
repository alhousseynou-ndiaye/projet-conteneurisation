name: CI (develop)

on:
  push:
    branches: ["develop"]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Import app (sanity check)
        run: |
          cd backend
          python -c "from app.main import app; print('OK')"

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-check
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t etl-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t etl-frontend:ci ./frontend
